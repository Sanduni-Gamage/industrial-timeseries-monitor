[project]
name = "industrial-timeseries-monitor"
version = "0.2.0"
description = "Industrial time-series monitoring platform for the UCI MetroPT-3 dataset"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    # Integration tests need a live SQL Server and are skipped automatically when one
    # is not reachable, so `pytest` works on a clean clone and in CI without a database.
    "integration: requires a reachable SQL Server instance",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI's Depends() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
# FastAPI and Starlette fix these handler signatures: an exception handler receives
# (request, exc) and a lifespan receives (app) whether or not it uses them. Renaming the
# parameters would be the only alternative, and it would make the contract less obvious.
"api/errors.py" = ["ARG001"]
"api/main.py" = ["ARG001"]
# Tests deliberately touch internals and use fixtures that read as unused arguments.
"tests/*" = ["ARG001", "ARG002", "N802"]
# SQL scripts are executed by path; os.path is not in play.
"scripts/*" = ["PTH123"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
ignore_missing_imports = true
# Pragmatic rather than absolute: the pipeline is fully annotated, but pandas and pyodbc
# return Any across most boundaries, so demanding strict typing there produces noise
# rather than safety.
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pandas.*", "pyodbc.*", "sklearn.*", "statsmodels.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["ingestion", "analytics", "api"]
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]
